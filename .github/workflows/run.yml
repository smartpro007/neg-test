name: Extract All Channel Keys

on:
  workflow_dispatch:

permissions:
  contents: write  # <--- हा भाग नवीन जोडा

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pywidevine

      - name: Run Batch Extractor
        run: |
          python extract_all.py

      - name: Commit and Push Keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add keys.json
          git commit -m "Auto-update channel keys [skip ci]" || echo "No changes to commit"
          git push
