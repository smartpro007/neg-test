name: Extract Keys via API

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'Channel Number or ID (e.g. 157811)'
        required: true
        default: '157811'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pywidevine

      - name: Decode WVD File
        env:
          WVD_SECRET: ${{ secrets.WVD_BASE64 }}
        run: |
          echo "$WVD_SECRET" | base64 --decode > device.wvd

      - name: Run Key Extractor
        run: |
          python extractor.py "${{ github.event.inputs.channel_id }}"
          
